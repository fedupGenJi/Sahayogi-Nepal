name: sahayogi_mobile
description: Sahayogi Nepal mobile app (volunteers + public requesters/donors).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_map: ^8.3.2
  flutter_map_location_marker: ^10.3.0
  geolocator: ^14.1.2
  latlong2: ^0.9.1
  flutter_svg: ^2.5.0
  image_picker: ^1.2.4
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_dotenv: ^6.0.2
  just_audio: ^0.10.6
  record: ^7.2.0
  http: ^1.6.0
  path_provider: ^2.1.5

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/VerticalLogo.png
    - assets/images/HorizontalLogo.svg
    - assets/images/VerticalLogo.svg
    - assets/images/SahayogiNepalLogo.svg
    - assets/terms_and_conditions.txt
    - assets/images/SahayogiNepalLogo.png
