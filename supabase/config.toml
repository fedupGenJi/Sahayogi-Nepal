project_id = "sahayogi-nepal"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[local_smtp]
port = 54324

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/set-password/",
  "https://fedupgenji.github.io/Sahayogi-Nepal/set-password/",
]
enable_signup = false
enable_anonymous_sign_ins = false
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(MAIL_FROM_ADDRESS)"
sender_name = "Sahayogi Nepal"

[auth.email.template.invite]
subject = "Set your Sahayogi Nepal password"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Sahayogi Nepal password"
content_path = "./supabase/templates/recovery.html"

[storage]
file_size_limit = "5MiB"

[functions.submit-request]
verify_jwt = false
[functions.assist-form]
verify_jwt = false
[functions.admin-login]
verify_jwt = false
[functions.volunteer-login]
verify_jwt = false
[functions.auth-me]
verify_jwt = false
[functions.request-password-reset]
verify_jwt = false
[functions.verify-reset-otp]
verify_jwt = false
[functions.reset-password]
verify_jwt = false
[functions.send-signup-otp]
verify_jwt = false
[functions.verify-signup-otp]
verify_jwt = false
[functions.create-upload-urls]
verify_jwt = false
[functions.submit-volunteer-application]
verify_jwt = false
[functions.approve-volunteer]
verify_jwt = false
[functions.view-volunteer-application]
verify_jwt = false
[functions.admin-set-account-status]
verify_jwt = false
# get-route checks the caller itself (requireUser), like the rest. Listed explicitly so behaviour is not left to defaults.
[functions.get-route]
verify_jwt = false
# send-push is called by the database (pg_net) with a shared secret in x-push-secret, not by users.
[functions.send-push]
verify_jwt = false

# Role-aware API over the RPCs. Each route checks the caller (admin / signed-in user / none) and forwards the caller's JWT to Postgres.
[functions.admin-api]
verify_jwt = false
[functions.volunteer-api]
verify_jwt = false
[functions.public-api]
verify_jwt = false

[db.seed]
enabled = true
sql_paths = [
    "./seeds/nepal_districts.sql"
]
